name: Build Release AAB
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - run: npm install

      - run: mkdir -p www && cp index.html www/

      - run: npx capacitor-assets generate --splashBackgroundColor "#0A2420" --iconBackgroundColor "#0A2420"

      - run: npx cap add android

      - run: npx cap sync

      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }

      - name: Set version
        run: |
          sed -E -i "s/versionCode( =)? [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -E -i 's/versionName( =)? "[^"]*"/versionName "1.0.${{ github.run_number }}"/' android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Decode and verify keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d ' \n\r' | base64 -d > upload.jks
          echo "ae652ddf7ddf9c553ff3d9e2195fc37716b9321d6f7f884bb49f8b53bbe0a6f8  upload.jks" | sha256sum -c - || (echo "KEYSTORE_BASE64 secret is corrupted - paste it again" && exit 1)

      - run: cd android && ./gradlew bundleRelease

      - name: Sign AAB
        run: |
          jarsigner -keystore upload.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -sigalg SHA256withRSA -digestalg SHA-256 android/app/build/outputs/bundle/release/app-release.aab eihyaha
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
          rm upload.jks

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
